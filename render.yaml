services:
  - type: web
    name: reachinbox-backend
    env: node
    region: oregon
    plan: free
    rootDir: apps/backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reachinbox-redis
          type: redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GLOBAL_HOURLY_LIMIT
        value: "100"
      - key: SENDER_HOURLY_LIMIT
        value: "50"
      - key: ELASTICSEARCH_URL
        sync: false

  - type: worker
    name: reachinbox-worker
    env: node
    region: oregon
    plan: free
    rootDir: apps/worker
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reachinbox-redis
          type: redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_MAX_RETRIES
        value: "3"
      - key: GLOBAL_HOURLY_LIMIT
        value: "100"
      - key: SENDER_HOURLY_LIMIT
        value: "50"
      - key: ELASTICSEARCH_URL
        sync: false

  - type: web
    name: reachinbox-frontend
    env: node
    region: oregon
    plan: free
    rootDir: apps/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox
    region: oregon
    plan: free
